name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  changesets:
    name: Release
    outputs:
      hasChangesets: ${{ steps.changesets-action.outputs.has-changesets }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to push version commits created by changesets/action.
      pull-requests: write # Required to open or update the release pull request.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets-action
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          commit-message: "ci: release"
          pr-title: "ci: release"

  # Retrieve version of `@portone/client-sdk-generator`
  version:
    name: Check Client SDK Generator version
    runs-on: ubuntu-24.04
    needs: changesets
    if: needs.changesets.outputs.hasChangesets == 'false'
    permissions:
      contents: read
    outputs:
      client-sdk-generator-version: ${{ steps.client-sdk-generator-version.outputs.version }}
      client-sdk-generator-released: ${{ steps.client-sdk-generator-version.outputs.released }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether the Client SDK Generator version is released
        id: client-sdk-generator-version
        run: |
          set -euo pipefail
          version=$(jq -er '.version' packages/@portone/client-sdk-generator/package.json)
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/@portone/client-sdk-generator@${version}" > /dev/null || status=$?
          case "$status" in
            0) released=true ;;
            2) released=false ;;
            *) exit "$status" ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "released=${released}" >> "$GITHUB_OUTPUT"

  # Building jobs

  build-binaries:
    needs: version
    if: needs.version.outputs.client-sdk-generator-released == 'false'
    strategy:
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
          - os: windows-2025
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            code-target: linux-x64-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            code-target: linux-arm64-musl
          - os: macos-26
            target: x86_64-apple-darwin
            code-target: darwin-x64
          - os: macos-26
            target: aarch64-apple-darwin
            code-target: darwin-arm64

    name: Package ${{ matrix.code-target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.code-target == 'linux-x64-musl' || matrix.code-target == 'linux-arm64-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cargo-audit
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2.82.0
        if: matrix.code-target == 'linux-x64-musl'
        with:
          tool: cargo-audit

      - name: Audit crates.io dependencies
        if: matrix.code-target == 'linux-x64-musl'
        run: cargo audit

      # Build the Client SDK Generator binary
      - name: Build binaries
        run: cargo build -p client_sdk_generator --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          # Strip all debug symbols from the resulting binaries
          RUSTFLAGS: "-C strip=symbols -C codegen-units=1"

      # Copy the Client SDK Generator binary and rename it to include the name of the target platform
      - name: Copy Client SDK Generator binary
        if: matrix.os == 'windows-2025'
        run: |
          mkdir dist
          cp "target/$TARGET/release/portone-client-sdk-generator.exe" "./dist/portone-client-sdk-generator-$CODE_TARGET.exe"
        env:
          TARGET: ${{ matrix.target }}
          CODE_TARGET: ${{ matrix.code-target }}
      - name: Copy Client SDK Generator binary
        if: matrix.os != 'windows-2025'
        run: |
          mkdir dist
          cp "target/$TARGET/release/portone-client-sdk-generator" "./dist/portone-client-sdk-generator-$CODE_TARGET"
        env:
          TARGET: ${{ matrix.target }}
          CODE_TARGET: ${{ matrix.code-target }}

      # Upload the Client SDK Generator binary as a build artifact
      - name: Upload Client SDK Generator artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-sdk-generator-${{ matrix.target }}
          path: ./dist/portone-client-sdk-generator-*
          if-no-files-found: error

  # Build GNU/Linux binaries in Docker, using Debian 11 (bullseye), to support older versions of glibc.
  build-binaries-gnu:
    needs: version
    if: needs.version.outputs.client-sdk-generator-released == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64

    name: Package ${{ matrix.code-target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    container:
      image: rust:1.89.0-bullseye@sha256:8f72d971a31b278cebdb2eb64a44c3900ff27c716a4ef6f4db05946d10c9ae4e

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set jemalloc page size for linux-arm64
        if: matrix.code-target == 'linux-arm64'
        run: |
          echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> $GITHUB_ENV

      # Build the Client SDK Generator binary
      - name: Build binaries
        run: cargo build -p client_sdk_generator --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          # Strip all debug symbols from the resulting binaries
          RUSTFLAGS: "-C strip=symbols -C codegen-units=1"

      # Copy the Client SDK Generator binary and rename it to include the name of the target platform
      - name: Copy Client SDK Generator binary
        run: |
          mkdir dist
          cp "target/$TARGET/release/portone-client-sdk-generator" "./dist/portone-client-sdk-generator-$CODE_TARGET"
        env:
          TARGET: ${{ matrix.target }}
          CODE_TARGET: ${{ matrix.code-target }}

      # Upload the Client SDK Generator binary as a build artifact
      - name: Upload Client SDK Generator artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-sdk-generator-${{ matrix.target }}
          path: ./dist/portone-client-sdk-generator-*
          if-no-files-found: error

  # Publishing jobs

  publish-client-sdk-generator:
    name: Publish Client SDK Generator
    runs-on: ubuntu-24.04
    needs:
      - version
      - build-binaries
      - build-binaries-gnu
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # Required for npm trusted staging and provenance.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Client SDK Generator artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: client-sdk-generator-*
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Generate npm packages
        run: node packages/@portone/client-sdk-generator/scripts/generate-packages.js

      - name: Stage npm packages for maintainer approval
        id: stage
        env:
          VERSION: ${{ needs.version.outputs.client-sdk-generator-version }}
        run: |
          set -euo pipefail
          pnpm stage publish --recursive --no-git-checks --ignore-scripts --registry https://registry.npmjs.org --tag latest --access public --provenance --report-summary
          staged=$(jq -r '.publishedPackages[] | "- `\(.id)`"' pnpm-publish-summary.json)
          {
            if [[ -z "$staged" ]]; then
              printf '### npm packages are already published: v%s\n' "$VERSION"
            else
              printf '### npm packages staged for approval: v%s\n\n' "$VERSION"
              printf '%s\n\n' "$staged"
              echo 'The npm packages are not live. Review them in [Staged Packages](https://www.npmjs.com/package/@portone/client-sdk-generator) or with `npm stage list` and `npm stage view <stage-id>`.'
              echo 'Approve all platform packages first, then `@portone/client-sdk-generator`, using `npm stage approve <stage-id>` (2FA required).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report npm staging failure
        if: failure() && steps.stage.outcome == 'failure'
        env:
          VERSION: ${{ needs.version.outputs.client-sdk-generator-version }}
        run: |
          {
            printf '### npm staging failed for v%s\n\n' "$VERSION"
            if [[ -f pnpm-publish-summary.json ]]; then
              echo 'Staged before the failure:'
              echo
              jq -r '.publishedPackages[] | "- `\(.id)`"' pnpm-publish-summary.json
              echo
            fi
            echo 'Packages already live on npm are skipped on retry, but staged packages are not. Before retrying, a maintainer should reject the staging entries for this version in npm Staged Packages. Do not approve the wrapper until all platform packages are available.'
          } >> "$GITHUB_STEP_SUMMARY"

  release-client-sdk-generator:
    name: Release Client SDK Generator
    runs-on: ubuntu-24.04
    needs:
      - version
      - publish-client-sdk-generator
    permissions:
      contents: write # Required to create the GitHub release and tag.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Client SDK Generator artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: client-sdk-generator-*
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        run: bash scripts/print-changelog.sh "$VERSION" > RELEASE_NOTES
        env:
          VERSION: ${{ needs.version.outputs.client-sdk-generator-version }}

      - name: Create GitHub @portone/client-sdk-generator release and tag
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi
          shopt -s nullglob
          assets=(release-assets/portone-client-sdk-generator-*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release create "$TAG_NAME" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "PortOne Client SDK Generator v$VERSION" \
            --notes-file RELEASE_NOTES \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: "@portone/client-sdk-generator@${{ needs.version.outputs.client-sdk-generator-version }}"
          VERSION: ${{ needs.version.outputs.client-sdk-generator-version }}
